<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AWS Serverless Security Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header id="topbar">
        <h1>AWS Serverless Security Dashboard</h1>

        <div id="auth-controls">
            <button type="button" id="sign-in-button">Sign in</button>
            <button type="button" id="sign-out-button" hidden>Sign out</button>
        </div>
    </header>

    <main>
        <section id="add-resource-panel">
            <h2>Add resource</h2>

            <form id="resource-form">
                <div class="field">
                    <label for="name">Name</label>
                    <input type="text" id="name" required>
                </div>

                <div class="field">
                    <label for="type">Type</label>
                    <input type="text" id="type" required>
                </div>

                <div class="field">
                    <label for="environment">Environment</label>
                    <select id="environment" required>
                        <option value="development">Development</option>
                        <option value="staging">Staging</option>
                        <option value="production">Production</option>
                    </select>
                </div>

                <div class="field">
                    <label for="owner">Owner</label>
                    <input type="text" id="owner" required>
                </div>

                <div class="field">
                    <label for="status">Status</label>
                    <select id="status" required>
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                        <option value="decommissioned">Decommissioned</option>
                    </select>
                </div>

                <div class="field">
                    <label for="securityReview">Security review</label>
                    <select id="securityReview" required>
                        <option value="pending">Pending</option>
                        <option value="in-progress">In progress</option>
                        <option value="complete">Complete</option>
                    </select>
                </div>

                <div class="field field-wide">
                    <label for="notes">Notes</label>
                    <textarea id="notes" rows="3"></textarea>
                </div>

                <div class="field-actions">
                    <button type="submit" id="submit-button">Add resource</button>
                    <button type="button" id="cancel-button" hidden>Cancel</button>
                </div>
            </form>
        </section>

        <section id="resources-panel">
            <h2>Resources</h2>

            <div id="resource-list">
                <p>Loading resources…</p>
            </div>
        </section>
    </main>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>

</html>
